                          description: Transaction identifier
                        merchant_name:
                          type: string
                          nullable: true
                          description: Raw merchant name
                        amount:
                          type: number
                          description: Transaction amount
                        billing_amount:
                          type: number
                          description: Billing amount
                        card_name:
                          type: string
                          description: Name of the card
                        card_holder_name:
                          type: string
                          description: Card holder name
                        created_at:
                          type: string
                          description: Transaction creation date
                        updated_at:
                          type: string
                          description: Transaction last update date
                        expense:
                          type: object
                          description: Associated expense information
                          properties:
                            status:
                              type: string
                              enum:
                              - incomplete
                              - pending_review
                              - ready
                              - synced
                              description: Expense status
                            description:
                              type: string
                              nullable: true
                              description: Expense description
                            invoice_number:
                              type: string
                              nullable: true
                              description: Invoice number
                            id:
                              type: string
                              description: Expense identifier
                            category:
                              type: string
                              nullable: true
                              description: Expense category
                            tax_code:
                              type: string
                              nullable: true
                              description: Tax code
                            payment_account:
                              type: string
                              nullable: true
                              description: Payment account
                            expense_account:
                              type: string
                              nullable: true
                              description: Expense account
                            vendor:
                              type: string
                              nullable: true
                              description: Vendor information
                            receipt_uploaded:
                              type: boolean
                              description: Whether receipt is uploaded
                            created_at:
                              type: string
                              description: Expense creation date
                            updated_at:
                              type: string
                              description: Expense last update date
                  pagination_meta:
                    type: object
                    properties:
                      page:
                        type: integer
                        description: Current page number
                      per_page:
                        type: integer
                        description: Items per page
                      total_pages:
                        type: integer
                        description: Total number of pages
                      next_page:
                        type: integer
                        nullable: true
                        description: Next page number
                      prev_page:
                        type: integer
                        nullable: true
                        description: Previous page number
                      from:
                        type: integer
                        description: Starting item number
                      to:
                        type: integer
                        description: Ending item number
                      total_count:
                        type: integer
                        description: Total number of items
                example:
                  data:
                  - kind: purchase
                    merchant_name_formatted: ACQUIRER NAME
                    amount_currency: AED
                    billing_amount_currency: AED
                    status: declined
                    card_last4: '7552'
                    id: CTX-ADE2D190C3
                    merchant_name: null
