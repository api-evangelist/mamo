openapi: 3.0.0
info:
  title: Mamo Business Business Details Transactions API
  version: '1.6'
  description: Mamo Business API follows the REST model. Its purpose is to enable Mamo Business users to automate payment link generation, charges, subscriptions, disbursements, recipients, cards, expenses and webhooks. Accepts JSON request bodies and returns JSON responses.
  contact:
    name: Mamo API Support
    email: api@mamopay.com
servers:
- url: https://business.mamopay.com/manage_api/v1
  description: Production server
- url: https://sandbox.dev.business.mamopay.com/manage_api/v1
  description: Sandbox server
security:
- bearerAuth: []
tags:
- name: Transactions
paths:
  /cards/transactions/{transactionId}:
    get:
      tags:
      - Transactions
      summary: Fetch Transaction Details
      description: Fetches detailed information for a specific card transaction<br><br>
      parameters:
      - name: transactionId
        in: path
        schema:
          type: string
          default: CTX-4584B3DEC9
        required: true
        description: Transaction ID
        example: CTX-4584B3DEC9
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind:
                    type: string
                    description: Type of transaction
                  merchant_name_formatted:
                    type: string
                    description: Formatted merchant name
                  amount_currency:
                    type: string
                    description: Transaction amount currency
                  billing_amount_currency:
                    type: string
                    description: Billing amount currency
                  status:
                    type: string
                    enum:
                    - success
                    - reversed
                    - declined
                    - refunded
                    description: Transaction status
                  card_last4:
                    type: string
                    description: Last 4 digits of card
                  id:
                    type: string
                    description: Transaction identifier
                  merchant_name:
                    type: string
                    nullable: true
                    description: Raw merchant name
                  amount:
                    type: number
                    description: Transaction amount
                  billing_amount:
                    type: number
                    description: Billing amount
                  card_name:
                    type: string
                    description: Name of the card
                  card_holder_name:
                    type: string
                    description: Card holder name
                  created_at:
                    type: string
                    description: Transaction creation date
                  updated_at:
                    type: string
                    description: Transaction last update date
                  expense:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                        - incomplete
                        - pending_review
                        - ready
                        - synced
                        description: Expense status
                      description:
                        type: string
                        nullable: true
                        description: Expense description
                      invoice_number:
                        type: string
                        nullable: true
                        description: Invoice number
                      id:
                        type: string
                        description: Expense identifier
                      category:
                        type: string
                        nullable: true
                        description: Expense category
                      tax_code:
                        type: string
                        nullable: true
                        description: Tax code
                      payment_account:
                        type: string
                        nullable: true
                        description: Payment account
                      expense_account:
                        type: string
                        nullable: true
                        description: Expense account
                      vendor:
                        type: string
                        nullable: true
                        description: Vendor information
                      receipt_uploaded:
                        type: boolean
                        description: Whether receipt is uploaded
                      created_at:
                        type: string
                        description: Expense creation date
                      updated_at:
                        type: string
                        description: Expense last update date
                example:
                  kind: purchase
                  merchant_name_formatted: ACQUIRER NAME
                  amount_currency: USD
                  billing_amount_currency: AED
                  status: success
                  card_last4: '9315'
                  id: CTX-4584B3DEC9
                  merchant_name: null
                  amount: 30
                  billing_amount: 114.05
                  card_name: Phu's card test2
                  card_holder_name: MCS integration
                  created_at: 03 Mar 2025, 01:41PM
                  updated_at: 03 Mar 2025, 01:41PM
                  expense:
                    status: incomplete
                    description: null
                    invoice_number: null
                    id: EXP-CCC03C324C
                    category: null
                    tax_code: null
                    payment_account: null
                    expense_account: null
                    vendor: null
                    receipt_uploaded: false
                    created_at: 03 Mar 2025, 01:41PM
                    updated_at: 03 Mar 2025, 01:41PM
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Unauthorized
                  error_code: UNAUTHORIZED
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Transaction not found
                  error_code: RECORD_NOT_FOUND
        '500':
          description: Unexpected error
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: number
                  error:
                    type: string
                example:
                  status: 500
                  error: Internal Server Error
      operationId: getCardsTransactionsTransactionid
  /cards/transactions:
    get:
      tags:
      - Transactions
      summary: Fetching Card Transactions
      description: Fetches all transactions for cards<br><br>
