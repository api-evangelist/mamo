                    type: string
                  refund_amount:
                    type: number
                  refund_status:
                    type: string
                  billing_descriptor:
                    type: string
                  custom_data:
                    type: object
                  created_date:
                    type: string
                  subscription_id:
                    type: string
                    description: Value is set for subscriptions only. For one-time payments, this will be null.
                  next_payment_date:
                    type: string
                    description: Value is set for subscriptions only. For one-time payments, this will be null.
                  settlement_amount:
                    type: number
                  settlement_currency:
                    type: string
                  settlement_date:
