  /charges/{chargeId}:
    get:
      tags:
      - Transactions
      summary: Fetch Transaction Info
      description: This API enables you to retrieve detailed information about a specific charge by providing the charge ID.<br>It is designed to give you a comprehensive view of transaction details.<br><br>
      parameters:
      - in: path
        name: chargeId
        schema:
          type: string
          default: MPB-CHRG-E0CE93E071
        required: true
        description: Transaction ID / Charge ID
        example: MPB-CHRG-E0CE93E071
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - confirmation_required
                    - captured
                    - refund_initiated
                    - processing
                    - failed
                    - refunded
                  id:
                    type: string
                  amount:
                    type: number
                  amount_currency:
                    type: string
                  refund_amount:
                    type: number
                  refund_status:
                    type: string
                  billing_descriptor:
                    type: string
                  custom_data:
                    type: object
                  created_date:
                    type: string
                  subscription_id:
                    type: string
                    description: Value is set for subscriptions only. For one-time payments, this will be null.
                  next_payment_date:
                    type: string
                    description: Value is set for subscriptions only. For one-time payments, this will be null.
                  settlement_amount:
                    type: number
                  settlement_currency:
                    type: string
                  settlement_date:
                    type: string
                  customer_details:
                    type: object
                    properties:
                      name:
                        type: string
                      email:
                        type: string
                      phone_number:
                        type: string
                      comment:
                        type: string
                  payment_method:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - CREDIT MASTERCARD
                        - CREDIT VISA
                        - CREDIT AMERICAN EXPRESS
                        - DEBIT MASTERCARD
                        - DEBIT VISA
                        - DEBIT AMERICAN EXPRESS
                      card_holder_name:
                        type: string
                      card_last4:
                        type: string
                      origin:
                        type: string
                  error_code:
                    type: string
                  error_message:
                    type: string
                example:
                  status: captured
                  id: MPB-CHRG-E0CE93E071
                  amount: 100
                  amount_currency: AED
                  refund_amount: 0
                  refund_status: No refund
                  billing_descriptor: Mamo*Merchant
