                  payment_method:
                    type: CREDIT VISA
                    card_holder_name: Mamo User
                    card_last4: •••• 4242
                    origin: UAE card
                  error_code: generic
                  error_message: Unknown reason - user should contact their bank to find out
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Unauthorized
                  error_code: UNAUTHORIZED
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
