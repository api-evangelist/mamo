      operationId: postInvoices
  /subscriptions:
    post:
      tags:
      - Subscriptions
      summary: Create Subscription
      description: Creates a subscription object that defines a billing schedule (frequency, interval, start/end date, etc).<br><br>
        ⚠️ This API only creates the subscription object; it does not associate the subscription with a payment link. For
        the subscription to function correctly, the returned subscription identifier must be attached to a payment link using
        the `subscription_id` attribute on the [Create Payment Link](/reference/post_links) or [Update Payment Link](/reference/patch_links-linkid)
        APIs.<br><br>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                frequency:
                  type: string
                  enum:
                  - weekly
                  - monthly
                  - annually
                  - daily
                  - test
                  description: Defines the interval that this subscription will be run on. `daily` and `test` are only available
                    in the sandbox environment for testing purposes and are rejected in production.
                frequency_interval:
                  type: integer
                  minimum: 1
                  description: Defines how often this subscription will run. This will be based on the frequency property
                    defined above.
                end_date:
                  type: string
                  pattern: \d{4}\/\d{2}\/\d{2}
                  description: The last date this subscription could run on.
                payment_quantity:
                  type: integer
                  description: Number of times this subscription will occur. If end_date is defined, end_date takes precedence.
                weekly_start_day:
                  type: string
                  enum:
                  - monday
                  - tuesday
                  - wednesday
                  - thursday
                  - friday
                  - saturday
                  - sunday
                  description: The day of the week this subscription starts on. Only applicable when frequency is weekly.
                monthly_start_date:
                  type: integer
                  minimum: 1
                  maximum: 28
                  description: The day of the month this subscription starts on. Only applicable when frequency is monthly
                    or annually.
              required:
              - frequency
              - frequency_interval
              example:
                frequency: monthly
                frequency_interval: 1
                end_date: 2027/02/28
                payment_quantity: 12
                monthly_start_date: 1
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    description: Unique identifier of the subscription
                  frequency:
                    type: string
                  frequency_interval:
                    type: integer
                  start_date:
                    type: string
                  end_date:
                    type: string
                  payment_quantity:
                    type: integer
                  monthly_start_date:
                    type: integer
                  weekly_start_day:
                    type: string
                example:
                  identifier: MPB-SUB-2162171A86
                  frequency: monthly
                  frequency_interval: 1
                  start_date: 2027/01/01
                  end_date: 2027/02/28
                  payment_quantity: 12
                  monthly_start_date: 1
                  weekly_start_day: null
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Unauthorized
                  error_code: UNAUTHORIZED
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Frequency can't be blank
                  error_code: VALIDATION_FAILED
        '500':
          description: Unexpected error
      operationId: postSubscriptions
