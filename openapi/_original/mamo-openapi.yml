            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                    identifier:
                      type: string
                      description: unique id from the disbursement
                      default: MPB-DISBMT-F2336E5CFB
                    reason:
                      type: string
                      default: Invoice payment
                    name:
                      type: string
                      description: Recipient's name
                      default: Homemade Chocolatier
                    amount_formatted:
                      type: string
                      description: Transfer amount
                      default: '100.12'
                    currency:
                      type: string
                      description: Currency code
                      default: AED
                    method:
                      type: string
                      description: Type of transfer
                      default: Bank account
                    recipient:
                      type: string
                      description: The recipient's bank account
                      default: AE080200000123223333121
                    created_at:
                      type: string
                      description: The date the disbursement was created at
                      default: 07/03/2023
                    status:
                      type: string
                      enum:
                      - Processing
                      - Processed
                      - Failed
                      description: Current status of the disbursement
                      default: Processing
                example:
                - id: 879
                  identifier: PYT-19044D349D
                  name: Test Business
                  amount_formatted: '50.00'
                  currency: AED
                  method: Bank account
                  recipient: AE080200000123223333121
                  created_at: 04/12/2025
                  status: Processing
