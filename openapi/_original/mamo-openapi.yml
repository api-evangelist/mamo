openapi: 3.0.0
info:
  title: Mamo Business API
  version: '1.6'
  description: Mamo Business API follows the REST model. Its purpose is to enable Mamo Business users to automate payment
    link generation, charges, subscriptions, disbursements, recipients, cards, expenses and webhooks. Accepts JSON request
    bodies and returns JSON responses.
  contact:
    name: Mamo API Support
    email: api@mamopay.com
servers:
- url: https://business.mamopay.com/manage_api/v1
  description: Production server
- url: https://sandbox.dev.business.mamopay.com/manage_api/v1
  description: Sandbox server
paths:
  /accounts/recipients/{recipientIdentifier}:
    delete:
      tags:
      - Recipients
      summary: Delete Recipient
      description: Allows a user to delete recipient.<br><br>
      parameters:
      - in: path
        name: recipientIdentifier
        schema:
          type: string
          default: REP-6BB7CA8DC7
        required: true
        description: Recipient Identifier
        example: REP-6BB7CA8DC7
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                example:
                  success: true
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Unauthorized
                  error_code: UNAUTHORIZED
        '404':
          description: Invalid request
        '500':
          description: Unexpected error
      operationId: deleteAccountsRecipientsRecipientidentifier
    get:
      tags:
      - Recipients
      summary: Fetch Recipient
      description: Allows a user to fetch recipient details.<br><br>
      parameters:
      - in: path
        name: recipientIdentifier
        schema:
          type: string
          default: REP-6BB7CA8DC7
        required: true
        description: Recipient Identifier
        example: REP-6BB7CA8DC7
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                  recipient_type:
                    type: string
                  name:
                    type: string
                  relationship:
                    type: string
                  email:
                    type: string
                  eid_number:
                    type: string
                  reason:
                    type: string
                  address:
                    type: object
                    properties:
                      address_line1:
                        type: string
                      address_line2:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      country:
                        type: string
                  bank:
                    type: object
                    properties:
                      iban:
                        type: string
                      account_number:
                        type: string
                      name:
                        type: string
                      bic_code:
                        type: string
                      address:
                        type: string
                      country:
                        type: string
                  created_at:
                    type: string
                  recipient_meta:
                    type: object
                example:
                  identifier: REP-D8B07FB8C7
                  name: first name last name
                  recipient_type: individual
                  relationship: others
                  reason: reason
                  email: null
                  eid_number: null
                  address: null
                  bank:
                    iban: AE080200000123223333121
                    country: AE
                    name: null
                    account_number: null
                    address: null
                    city: null
                    bic_code: null
                  created_at: 19/02/2024
                  recipient_meta: {}
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Unauthorized
                  error_code: UNAUTHORIZED
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Merchant::Recipient record was not found
                  error_code: RECORD_NOT_FOUND
        '500':
          description: Unexpected error
      operationId: getAccountsRecipientsRecipientidentifier
    patch:
      tags:
      - Recipients
      summary: Update Recipient
      description: Allows a user to update recipient details.<br><br>
      parameters:
      - in: path
        name: recipientIdentifier
        schema:
          type: string
          default: REP-6BB7CA8DC7
        required: true
        description: Recipient Identifier
        example: REP-6BB7CA8DC7
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_type:
                  type: string
                  enum:
                  - individual
                  - business
                  description: The type of the recipient.
                  default: individual
                email:
                  type: string
                  description: Recipient's email.
                business_name:
                  type: string
                  description: Name of the recipient when recipient_type is business.
                first_name:
                  type: string
                  description: First name of the recipient when recipient_type is individual.
                last_name:
                  type: string
                  description: Last name of the recipient when recipient_type is individual.
                relationship:
                  type: string
                  enum:
                  - business_associate_partner
                  - customer
                  - employee
                  - branch_representative_office
                  - subsidiary_company
                  - holding_company
                  - supplier
                  - creditor
                  - debtor
                  - franchisee_franchisor
                  - others
                  description: Recipient's relationship
                reason:
                  type: string
                  description: Reason for the payouts issued to this recipient.
                eid_number:
                  type: string
                  description: Recipient's Emirates ID number.
                bank:
                  type: object
                  properties:
                    iban:
                      type: string
                      description: Recipient's IBAN.
                      default: AE080200000123223333121
                    account_number:
                      type: string
                      description: Recipient's bank account number (only iban or account_number is required)
                    address:
                      type: string
                      description: Recipient's bank address.
                    country:
                      type: string
                      description: Recipient's bank country (two letters ISO country code).
                      default: AE
                    name:
                      type: string
                      description: Recipient's bank name.
                    bic_code:
                      type: string
                      description: Recipient's bank identifier codes for non UAE bank.
                address:
                  type: object
                  properties:
                    address_line1:
                      type: string
                      description: Recipient's first line of the address.
                    address_line2:
                      type: string
                      description: Recipient's second line of the address.
                    city:
                      type: string
                      description: Recipient's city.
                    state:
                      type: string
                      description: 'The state or province of the address in ISO 3166-2 (for example: CA for California in
                        the United States).'
                    country:
                      type: string
                      description: Recipient's address country (two letters ISO country code).
                recipient_meta:
                  type: object
              example:
                recipient_type: individual
                first_name: first name
                last_name: last name
                relationship: others
                reason: reason
                bank:
                  iban: AE080200000123223333121
                  country: AE
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                  recipient_type:
                    type: string
                  name:
                    type: string
                  relationship:
                    type: string
                  email:
                    type: string
                  eid_number:
                    type: string
                  reason:
                    type: string
                  address:
                    type: object
                    properties:
                      address_line1:
                        type: string
                      address_line2:
                        type: string
                      city:
                        type: string
                      state:
                        type: string
                      country:
                        type: string
                  bank:
                    type: object
                    properties:
                      iban:
                        type: string
                      account_number:
                        type: string
                      name:
                        type: string
                      bic_code:
                        type: string
                      address:
                        type: string
                      country:
                        type: string
                  created_at:
                    type: string
                  recipient_meta:
                    type: object
                example:
                  identifier: REP-D8B07FB8C7
                  name: first name last name
                  recipient_type: individual
                  relationship: others
                  reason: reason
                  email: null
                  eid_number: null
                  address: null
                  bank:
                    iban: AE080200000123223333121
                    country: AE
                    name: null
                    account_number: null
                    address: null
                    city: null
                    bic_code: null
                  created_at: 19/02/2024
                  recipient_meta: {}
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Unauthorized
                  error_code: UNAUTHORIZED
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Merchant::Recipient record was not found
                  error_code: RECORD_NOT_FOUND
        '500':
          description: Unexpected error
      operationId: patchAccountsRecipientsRecipientidentifier
  /links/{linkId}:
    delete:
      tags:
      - Payment Links
      summary: Delete Payment Link
      description: Allows a user to delete payment link<br><br>
      parameters:
      - in: path
        name: linkId
        schema:
          type: string
          default: MB-LINK-6BB7CA8DC7
        required: true
        description: Payment link ID
        example: MB-LINK-6BB7CA8DC7
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                example:
                  success: true
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Unauthorized
                  error_code: UNAUTHORIZED
        '404':
          description: Invalid request
        '500':
          description: Unexpected error
      operationId: deleteLinksLinkid
    get:
      tags:
      - Payment Links
      summary: Fetch Payment Link Info
      description: Allows a user to fetch payment link details<br><br>
      parameters:
      - in: path
        name: linkId
        schema:
          type: string
          default: MB-LINK-6BB7CA8DC7
        required: true
        description: Payment link ID
        example: MB-LINK-6BB7CA8DC7
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 75
                    description: The title of the payment link
                    default: Chocolate Box - Small
                  description:
                    type: string
                    maxLength: 75
                    description: Payment description. This will appear on the payment checkout page.
                    default: 12pcs Chocolate Box
                  capacity:
                    type: integer
                    description: The number of times a payment link can be used. The capacity will be ignored when the subscription
                      params exist.
                    default: 1
                  active:
                    type: boolean
                    default: true
                  return_url:
                    type: string
                    format: uri
                    description: The URL which the customer will be redirected to after a successful payment.
                    default: https://myawesomewebsite.com/paymentSuccess
                  terms_and_conditions_url:
                    type: string
                    format: uri
                    description: The URL to the terms and conditions page, if provided, the customer will be required to accept
                      the terms before proceeding to payment.
                  processing_fee_percentage:
                    type: number
                    minimum: 2
                    default: 3
                  amount:
                    type: number
                    minimum: 2
                    default: 119.99
                  amount_currency:
                    type: string
                    enum:
                    - AED
                    - USD
                    - EUR
                    - GBP
                    - SAR
                    default: AED
                  link_type:
                    type: string
                    enum:
                    - standalone
                    - modal
                    - inline
                    description: Type of link to be created.
                    default: standalone
                  enable_tabby:
                    type: boolean
                    description: Enables the ability for customers to buy now and pay later.
                    default: false
                  enable_message:
                    type: boolean
                    description: Enables the ability for customers to add a message during the checkout process.
                    default: false
                  enable_tips:
                    type: boolean
                    description: Enables the tips option. This will be displayed on the first screen.
                    default: false
                  enable_customer_details:
                    type: boolean
                    description: Enables adding customer details such as the name, email, and phone number. This screen will
                      be displayed before the payment details screen.
                    default: false
                  enable_quantity:
                    type: boolean
                    description: When enabled, customers can specify the number of items they intend to purchase. This quantity
                      will serve as a multiplier for the base amount.
                    default: false
                  enable_qr_code:
                    type: boolean
                    description: Adds the ability to verify a payment through a QR code.
                    default: false
                  send_customer_receipt:
                    type: boolean
                    description: Enables the sending of customer receipts.
                    default: false
                  save_card:
                    type: string
                    enum:
                    - 'off'
                    - optional
                    - required
                    description: Allows the merchant to enable the option to store card details to be used later on for Merchant
                      Initiated Transactions.
                    default: 'off'
                  payment_methods:
                    type: array
                    description: 'An array of accepted payment methods, card always apart of default option. Example: [''card'',
                      ''wallet'']'
                  rules:
                    type: object
                    description: Setting the rule for payment link
                    properties:
                      allowed:
                        type: array
                        description: An array of one or more rules
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - bins
                              description: name of rules
                            list:
                              type: array
                              description: value of bins
                            decline_message:
                              type: string
                              description: Custom decline message for this rule
                  subscription:
                    type: object
                    description: to be populated if this payment link is for a subscription. Otherwise, this property can
                      be left out.
                    properties:
                      frequency:
                        type: string
                        enum:
                        - annually
                        - monthly
                        - weekly
                        description: defines the interval that this subscription will be run on.
                      frequency_interval:
                        type: integer
                        minimum: 1
                        description: defines how often this subscription will run. This will be based on the frequency property
                          defined above.
                      end_date:
                        type: string
                        pattern: \d{4}\/\d{2}\/\d{2}
                        description: the last date this subscription could run on.
                      payment_quantity:
                        type: integer
                        description: number of times this subscription will occur. If end_date defined, end_date takes precedence.
                  first_name:
                    type: string
                    description: The first name of customer which will pre-populate in card info step.
                  last_name:
                    type: string
                    description: The last name of customer which will pre-populate in card info step.
                  email:
                    type: string
                    description: The email of customer which will pre-populate in card info step.
                  payouts_share:
                    type: object
                    properties:
                      recipient_id:
                        type: string
                        description: The ID of an already added recipient that the transaction amount will be shared with.
                      percentage_to_recipient:
                        type: number
                        description: The percentage of the transaction amount that will be sent to the recipient.
                      recipient_pays_fees:
                        type: boolean
                        description: Whether Mamo fees for a given transaction will be passed on to the recipient.
                  custom_data:
                    type: object
                  id:
                    type: string
                  title:
                    type: string
                  platform:
                    type: string
                  prefilled_customer:
                    type: object
                  external_id:
                    type: string
                  hold_and_charge_later:
                    type: boolean
                  internal_note:
                    type: string
                  lang:
                    type: string
                  expiration_date:
                    type: string
                  is_widget:
                    type: boolean
                  max_amount:
                    type: number
                  processing_fee_amount:
                    type: number
                  payment_url:
                    type: string
                  charges:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          enum:
                          - confirmation_required
                          - captured
                          - refund_initiated
                          - processing
                          - failed
                          - refunded
                        id:
                          type: string
                        amount:
                          type: number
                        refund_amount:
                          type: number
                        refund_status:
                          type: string
                        billing_descriptor:
                          type: string
                        custom_data:
                          type: object
                        created_date:
                          type: string
                        subscription_id:
                          type: string
                        settlement_amount:
                          type: number
                        settlement_currency:
                          type: string
                        settlement_date:
                          type: string
                        customer_details:
                          type: object
                          properties:
                            name:
                              type: string
                            email:
                              type: string
                            phone_number:
                              type: string
                            comment:
                              type: string
                        payment_method:
                          type: object
                          properties:
                            type:
                              type: string
                            card_holder_name:
                              type: string
                            card_last4:
                              type: string
                            origin:
                              type: string
                example:
                  id: MB-LINK-37D90AAF51
                  title: Test Payment Link
                  name: Test Payment Link
                  description: Test description
                  capacity: 1
                  active: true
                  return_url: https://myawesomewebsite.com/paymentSuccess
                  processing_fee_percentage: 0
                  amount: 10
                  amount_currency: AED
                  platform: client
                  prefilled_customer: {}
                  external_id: null
                  hold_and_charge_later: false
                  internal_note: null
                  lang: en
                  expiration_date: null
                  enable_message: false
                  enable_tips: false
                  enable_tabby: false
                  link_type: standalone
                  enable_customer_details: false
                  save_card: 'off'
                  is_widget: false
                  max_amount: null
                  processing_fee_amount: null
                  enable_quantity: false
                  payment_methods:
                  - card
                  - wallet
                  rules:
                    allowed: []
                  subscription: null
                  first_name: null
                  last_name: null
                  email: null
                  payouts_share: null
                  custom_data: {}
                  payment_url: https://sandbox.dev.business.mamopay.com/pay/mamo-c1f890
                  send_customer_receipt: true
                  terms_and_conditions_url: null
                  charges:
                  - status: captured
                    id: MPB-CHRG-E0CE93E071
                    amount: 100
                    refund_amount: 0
                    refund_status: No refund
                    billing_descriptor: Mamo*Merchant
                    custom_data:
                      internal_customer_id: 0114120d-c394-4cce-9cdb-4ccbae605748
                      val1: true
                      val2: custom value
                    created_date: 2023-05-31-11-18-57
                    subscription_id: MPB-SUB-B764EDCBA2
                    settlement_amount: 356.42
                    settlement_currency: AED
                    settlement_date: 05/06/2023
                    customer_details:
                      name: Mamo User
                      email: email@mamopay.com
                      phone_number: '+971551234567'
                      comment: Dolore voluptate possimus et.
                    payment_method:
                      type: CREDIT VISA
                      card_holder_name: Mamo User
                      card_last4: •••• 4242
                      origin: UAE card
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Unauthorized
                  error_code: UNAUTHORIZED
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Merchant::Link record was not found
                  error_code: RECORD_NOT_FOUND
        '500':
          description: Unexpected error
      operationId: getLinksLinkid
    patch:
      tags:
      - Payment Links
      summary: Update Payment Link
      description: Allows a user to update payment link details<br><br>
      parameters:
      - in: path
        name: linkId
        schema:
          type: string
          default: MB-LINK-6BB7CA8DC7
        required: true
        description: Payment link ID
        example: MB-LINK-6BB7CA8DC7
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 75
                  description: The title of the payment link
                  default: Chocolate Box - Small
                description:
                  type: string
                  maxLength: 75
                  description: Payment description. This will appear on the payment checkout page.
                  default: 12pcs Chocolate Box
                capacity:
                  type: integer
                  description: The number of times a payment link can be used. The capacity will be ignored when the subscription
                    params exist.
                  default: 1
                active:
                  type: boolean
                  default: true
                return_url:
                  type: string
                  format: uri
                  description: The URL which the customer will be redirected to after a successful payment.
                  default: https://myawesomewebsite.com/paymentSuccess
                failure_return_url:
                  type: string
                  format: uri
                  description: The URL which the customer will be redirected to after a failure payment.
                  default: https://failureurl.com/paymentFailure
                terms_and_conditions_url:
                  type: string
                  format: uri
                  description: The URL to the terms and conditions page, if provided, the customer will be required to accept
                    the terms before proceeding to payment.
                processing_fee_percentage:
                  type: number
                  minimum: 2
                  default: 3
                amount:
                  type: number
                  minimum: 2
                  description: amount could be 0 with save_card 'required' option for card verification
                  default: 119.99
                amount_currency:
                  type: string
                  enum:
                  - AED
                  - USD
                  - EUR
                  - GBP
                  - SAR
                  default: AED
                link_type:
                  type: string
                  enum:
                  - standalone
                  - modal
                  - inline
                  description: Type of link to be created.
                  default: standalone
                enable_tabby:
                  type: boolean
                  description: Enables the ability for customers to buy now and pay later.
                  default: false
                enable_message:
                  type: boolean
                  description: Enables the ability for customers to add a message during the checkout process.
                  default: false
                enable_tips:
                  type: boolean
                  description: Enables the tips option. This will be displayed on the first screen.
                  default: false
                save_card:
                  type: string
                  enum:
                  - 'off'
                  - optional
                  - required
                  default: 'off'
                  description: Allows the merchant to enable the option to store card details to be used later on for Merchant
                    Initiated Transactions.
                enable_customer_details:
                  type: boolean
                  description: Enables adding customer details such as the name, email, and phone number. This screen will
                    be displayed before the payment details screen.
                  default: false
                enable_quantity:
                  type: boolean
                  description: When enabled, customers can specify the number of items they intend to purchase. This quantity
                    will serve as a multiplier for the base amount.
                  default: false
                enable_qr_code:
                  type: boolean
                  description: Adds the ability to verify a payment through a QR code.
                  default: false
                send_customer_receipt:
                  type: boolean
                  description: Enables the sending of customer receipts.
                  default: false
                payment_methods:
                  type: array
                  description: 'An array of accepted payment methods, card always apart of default option. Example: [''card'',
                    ''wallet'']'
                rules:
                  type: object
                  description: Setting the rule for payment link
                  properties:
                    allowed:
                      type: array
                      description: An array of one or more rules
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - bins
                            description: name of rules
                          list:
                            type: array
                            description: value of bins
                          decline_message:
                            type: string
                            description: Custom decline message for this rule
                subscription_id:
                  type: string
