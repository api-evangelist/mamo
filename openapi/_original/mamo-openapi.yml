      description: Fetches all payment links for a given business<br><br>
      parameters:
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
      - name: Authorization
        in: header
        schema:
          type: string
        example: Bearer <your sandbox api key>
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 75
                          description: The title of the payment link
                          default: Chocolate Box - Small
                        description:
                          type: string
                          maxLength: 75
                          description: Payment description. This will appear on the payment checkout page.
                          default: 12pcs Chocolate Box
                        capacity:
                          type: integer
                          description: The number of times a payment link can be used. The capacity will be ignored when the
                            subscription params exist.
                          default: 1
                        active:
                          type: boolean
                          default: true
                        return_url:
                          type: string
                          format: uri
                          description: The URL which the customer will be redirected to after a successful payment.
                          default: https://myawesomewebsite.com/paymentSuccess
                        terms_and_conditions_url:
                          type: string
                          format: uri
                          description: The URL to the terms and conditions page, if provided, the customer will be required
                            to accept the terms before proceeding to payment.
                        processing_fee_percentage:
                          type: number
                          minimum: 2
                          default: 3
                        amount:
                          type: number
                          minimum: 2
                          default: 119.99
                        amount_currency:
                          type: string
                          enum:
                          - AED
                          - USD
                          - EUR
                          - GBP
                          - SAR
                          default: AED
                        link_type:
                          type: string
                          enum:
                          - standalone
                          - modal
                          - inline
                          description: Type of link to be created.
                          default: standalone
                        enable_tabby:
                          type: boolean
                          description: Enables the ability for customers to buy now and pay later.
                          default: false
                        enable_message:
                          type: boolean
                          description: Enables the ability for customers to add a message during the checkout process.
                          default: false
                        enable_tips:
                          type: boolean
                          description: Enables the tips option. This will be displayed on the first screen.
                          default: false
                        enable_customer_details:
                          type: boolean
                          description: Enables adding customer details such as the name, email, and phone number. This screen
                            will be displayed before the payment details screen.
                          default: false
                        enable_quantity:
                          type: boolean
                          description: When enabled, customers can specify the number of items they intend to purchase. This
                            quantity will serve as a multiplier for the base amount.
                          default: false
                        enable_qr_code:
                          type: boolean
                          description: Adds the ability to verify a payment through a QR code.
                          default: false
                        send_customer_receipt:
                          type: boolean
                          description: Enables the sending of customer receipts.
                          default: false
                        save_card:
                          type: string
                          enum:
                          - 'off'
                          - optional
                          - required
                          description: Allows the merchant to enable the option to store card details to be used later on
                            for Merchant Initiated Transactions.
                          default: 'off'
                        payment_methods:
                          type: array
                          description: 'An array of accepted payment methods, card always apart of default option. Example:
                            [''card'', ''wallet'']'
                        rules:
                          type: object
                          description: Setting the rule for payment link
                          properties:
                            allowed:
                              type: array
                              description: An array of one or more rules
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    enum:
                                    - bins
                                    description: name of rules
                                  list:
                                    type: array
                                    description: value of bins
                                  decline_message:
                                    type: string
                                    description: Custom decline message for this rule
                        subscription:
                          type: object
                          description: to be populated if this payment link is for a subscription. Otherwise, this property
                            can be left out. REQUIRES Premium Business Plan to be enabled.
                          properties:
                            frequency:
                              type: string
                              enum:
                              - annually
                              - monthly
                              - weekly
                              description: defines the interval that this subscription will be run on.
                            frequency_interval:
                              type: integer
                              minimum: 1
                              description: defines how often this subscription will run. This will be based on the frequency
                                property defined above.
                            end_date:
                              type: string
                              pattern: \d{4}\/\d{2}\/\d{2}
                              description: the last date this subscription could run on.
                            payment_quantity:
                              type: integer
                              description: number of times this subscription will occur. If end_date defined, end_date takes
                                precedence.
                        first_name:
                          type: string
                          description: The first name of customer which will pre-populate in card info step.
                        last_name:
                          type: string
                          description: The last name of customer which will pre-populate in card info step.
                        email:
                          type: string
                          description: The email of customer which will pre-populate in card info step.
                        payouts_share:
                          type: object
                          properties:
                            recipient_id:
                              type: string
                              description: The ID of an already added recipient that the transaction amount will be shared
                                with.
                            percentage_to_recipient:
                              type: number
                              description: The percentage of the transaction amount that will be sent to the recipient.
                            recipient_pays_fees:
                              type: boolean
                              description: Whether Mamo fees for a given transaction will be passed on to the recipient.
                        custom_data:
                          type: object
                        id:
                          type: string
                        title:
                          type: string
                        platform:
                          type: string
                        prefilled_customer:
                          type: object
                        external_id:
                          type: string
                        hold_and_charge_later:
                          type: boolean
                        internal_note:
                          type: string
                        lang:
                          type: string
                        expiration_date:
                          type: string
                        is_widget:
                          type: boolean
                        max_amount:
                          type: number
                        processing_fee_amount:
                          type: number
                        payment_url:
                          type: string
                  pagination_meta:
                    type: object
                    properties:
                      page:
                        type: number
                      per_page:
                        type: number
                      total_pages:
                        type: number
                      next_page:
                        type: number
                      prev_page:
                        type: number
                      from:
                        type: number
                      to:
                        type: number
                      total_count:
                        type: number
                example:
                  data:
                  - id: MB-LINK-37D90AAF51
                    title: Test Payment Link
                    name: Test Payment Link
                    description: Test description
                    capacity: 1
                    active: true
                    return_url: https://myawesomewebsite.com/paymentSuccess
                    processing_fee_percentage: 0
                    amount: 10
                    amount_currency: AED
                    platform: client
                    prefilled_customer: {}
                    external_id: null
                    hold_and_charge_later: false
                    internal_note: null
                    lang: en
                    expiration_date: null
                    enable_message: false
                    enable_tips: false
                    enable_tabby: false
                    link_type: standalone
                    enable_customer_details: false
                    save_card: 'off'
                    is_widget: false
                    max_amount: null
                    processing_fee_amount: null
                    enable_quantity: false
                    payment_methods:
                    - card
                    - wallet
                    rules:
                      allowed: []
                    subscription: null
                    first_name: null
                    last_name: null
                    email: null
                    payouts_share: null
                    custom_data: {}
                    payment_url: https://sandbox.dev.business.mamopay.com/pay/mamo-c1f890
                    send_customer_receipt: true
                    terms_and_conditions_url: null
                  pagination_meta:
                    page: 1
                    per_page: 10
                    total_pages: 5
                    next_page: 2
                    prev_page: null
                    from: 1
                    to: 10
                    total_count: 47
        '403':
          description: Unauthorised
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: string
                  error_code:
                    type: string
                example:
                  messages:
                  - Unauthorized
                  error_code: UNAUTHORIZED
        '500':
          description: Unexpected error
      operationId: getLinks
    post:
      tags:
      - Payment Links
      summary: Create Payment Link
      description: 'API to generate vanilla and subscription payment links. <br> <h3>Payment Status</h3> Once your customer
        completes a payment, the redirect URL will be appended with the following params<br> - createdAt: The date the charge
        was captured at<br> - paymentLinkId: The payment link id<br> - status: indicates the payment status, whether captured
        or failed<br> - transactionId: The transaction / charge id related to the payment<br> <br> You may also get notified
        about a payment''s status by setting up a webhook. Details [here](https://mamopay.readme.io/reference/post_webhooks)<br>
        <br> A third approach to check the transaction status is by calling our transaction info API [here](https://mamopay.readme.io/reference/get_charges-chargeid)<br>
        <br> **Sample redirect url after a successful payment**<br> https://www.mamopay.com/?createdAt=2023-08-09-16-42-35&paymentLinkId=MB-LINK-3216D27C9D&status=captured&transactionId=MPB-CHRG-BEE56990A9<br>
        <br>

        <h3>For Payment Testing</h3>

        <p>To make payments with different use cases on the test environment, you can use the card details below alongside
        the below CVV and expiry date.</p> - CVV: 123<br> - Expiry: 01/28

        <table> <thead> <tr> <th>Card Number</th> <th>Payment Status</th> <th>3DS</th> <th>Address Required</th> <th>Country</th>
        </tr> </thead> <tbody> <tr> <td>4659 1055 6905 1157</td> <td>Success</td> <td>X</td> <td>X</td> <td>GB</td> </tr>
        <tr> <td>4242 4242 4242 4242</td> <td>Success</td> <td>✓</td> <td>X</td> <td>GB</td> </tr> <tr> <td>4111 1111 1111
        1111</td> <td>Success</td> <td>✓</td> <td>✓</td> <td>US</td> </tr> <tr> <td>4567 3613 2598 1788</td> <td>Fail</td>
        <td>X</td> <td>X</td> <td>GB</td> </tr> <tr> <td>4095 2548 0264 2505</td> <td>Fail</td> <td>X</td> <td>✓</td> <td>US</td>
        </tr> </tbody> </table>




        <br> <h3>3DS</h3> If prompted for a password, enter **Checkout1!**<br> <br> <h3>Subscriptions</h3> To create a subscription
        payment link, create the subscription first using the [Create Subscription](/reference/post_subscriptions) API, then
        pass its identifier as `subscription_id` below with `link_type` set to `inline`. The inline `subscription` object
        is a legacy, backwards-compatible alternative — when setting it up, if both end_date and payment_quantity were defined,
        end_date takes precedence.<br><br> '
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: The title of the payment link
                  default: Chocolate Box - Small
                description:
                  type: string
                  maxLength: 75
                  description: Payment description. This will appear on the payment checkout page.
                  default: 12pcs Chocolate Box
                capacity:
                  type: integer
                  description: The number of times a payment link can be used, if null the link can be used indefinitely.
                    The capacity will be ignored when the subscription params exist.
                active:
                  type: boolean
                  default: true
                return_url:
                  type: string
                  format: uri
                  description: The URL which the customer will be redirected to after a successful payment.
                  default: https://myawesomewebsite.com/paymentSuccess
                failure_return_url:
                  type: string
                  format: uri
                  description: The URL which the customer will be redirected to after a failure payment.
                  default: https://failureurl.com/paymentFailure
                terms_and_conditions_url:
                  type: string
                  format: uri
                  description: The URL to the terms and conditions page, if provided, the customer will be required to accept
                    the terms before proceeding to payment.
                processing_fee_percentage:
                  type: number
                  description: Processing fee that you as a merchant can impose on your customers
                  minimum: 0
                  default: 0
                amount:
                  type: number
                  minimum: 2
                  description: amount could be 0 with save_card 'required' option for card verification
                  default: 119.99
                amount_currency:
                  type: string
                  enum:
                  - AED
                  - USD
                  - EUR
                  - GBP
                  - SAR
                  default: AED
                  description: Currency code for the payment amount. See [examples](https://help.mamopay.com/en/articles/8225989-supported-currencies)
                    for more details.
                link_type:
                  type: string
                  enum:
                  - standalone
                  - modal
                  - inline
                  description: Type of link to be created.
                  default: standalone
                enable_tabby:
                  type: boolean
                  description: Enables the ability for customers to buy now and pay later.
                  default: false
                enable_message:
                  type: boolean
                  description: Enables the ability for customers to add a message during the checkout process.
                  default: false
                enable_tips:
                  type: boolean
                  description: Enables the tips option. This will be displayed on the first screen.
                  default: false
                save_card:
                  type: string
                  enum:
                  - 'off'
                  - optional
                  - required
                  description: Allows the merchant to enable the option to store card details to be used later on for Merchant
                    Initiated Transactions.
                  default: 'off'
                enable_customer_details:
                  type: boolean
                  description: Enables adding customer details such as the name, email, and phone number. This screen will
                    be displayed before the payment details screen.
                  default: false
                enable_quantity:
                  type: boolean
                  description: When enabled, customers can specify the number of items they intend to purchase. This quantity
                    will serve as a multiplier for the base amount.
                  default: false
                enable_qr_code:
                  type: boolean
                  description: Adds the ability to verify a payment through a QR code.
                  default: false
                send_customer_receipt:
                  type: boolean
                  description: Enables the sending of customer receipts.
                  default: false
                payment_methods:
                  type: array
                  description: 'An array of the accepted payment methods, with ''card'' always included as the default option,
                    and wallet for Apple Pay and Google Pay. Example to accept all: [''card'', ''wallet'']'
                rules:
                  type: object
                  description: Setting the rule for payment link
                  properties:
                    allowed:
                      type: array
                      description: An array of one or more rules
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                            enum:
                            - bins
                            description: name of rules
                          list:
                            type: array
                            description: value of bins
                          decline_message:
                            type: string
                            description: Custom decline message for this rule
                subscription_id:
                  type: string
                  description: The identifier of an existing subscription (created via the [Create Subscription](/reference/post_subscriptions)
                    API) to attach to this payment link. This is the recommended way to create a subscription payment link
                    — create the subscription first, then pass its identifier here. Requires `link_type` to be `inline`.
                subscription:
                  type: object
                  description: Legacy, backwards-compatible way to configure a subscription inline, to be populated if this
                    payment link is for a subscription. Otherwise, this property can be left out. New integrations should
                    use the `subscription_id` field instead, together with the Create Subscription API.
                  properties:
                    frequency:
                      type: string
                      enum:
                      - annually
                      - monthly
                      - weekly
                      description: defines the interval that this subscription will be run on.
                    frequency_interval:
                      type: integer
                      minimum: 1
                      description: defines how often this subscription will run. This will be based on the frequency property
                        defined above.
                    start_date:
                      type: string
                      pattern: \d{4}\/\d{2}\/\d{2}
                      description: the first date this subscription will run on.
                    end_date:
                      type: string
                      pattern: \d{4}\/\d{2}\/\d{2}
                      description: the last date this subscription could run on.
                    payment_quantity:
                      type: integer
                      description: number of times this subscription will occur. If end_date defined, end_date takes precedence.
                first_name:
                  type: string
                  description: The first name of customer which will pre-populate in card info step.
                last_name:
                  type: string
                  description: The last name of customer which will pre-populate in card info step.
                email:
                  type: string
                  description: The email of customer which will pre-populate in card info step.
                custom_data:
                  type: object
                external_id:
                  type: string
                  description: The external ID of your choice to associate with payments captured by this payment link.
                hold_and_charge_later:
                  type: boolean
                  default: false
                  description: Indicates whether to place the payment on hold and charge it later using the "captures" API.
                payouts_share:
                  type: object
                  properties:
                    recipient_id:
                      type: string
                      description: The ID of an already added recipient that the transaction amount will be shared with.
                    percentage_to_recipient:
                      type: number
                      description: The percentage of the transaction amount that will be sent to the recipient.
                    recipient_pays_fees:
                      type: boolean
                      description: Whether Mamo fees for a given transaction will be passed on to the recipient.
              required:
