  /subscriptions/{subscriptionId}/subscribers/{subscriberId}/change_customer_subscription:
    patch:
      tags:
      - Subscriptions
      summary: Change Customer Subscription
      description: 'Upgrades a subscriber from their current subscription to a target subscription, without requiring the
        customer to re-enter their card details.


        Prorates and charges the difference (target plan''s price minus the unused remainder of the current subscription''s
        period) against the target plan''s payment link, then activates the target subscriber and unsubscribes the current
        one.


        ### Constraints (v1)


        - Only **upgrades** are supported — the target subscription''s first payment amount must exceed the current subscription''s
        prorated remaining value by at least the minimum chargeable difference. Downgrades are not yet supported and will
        typically fail with `PRORATION_BELOW_MINIMUM`.

        - The target subscription must have an **immediate start date** — you cannot change a subscriber onto a future-dated
        subscription.

        - The current and target subscriptions must use the **same currency**.


        ### Error codes


        | error_code | Meaning |

        | --- | --- |

        | `INACTIVE_SUBSCRIBER` | The subscriber is not active |

        | `MISSING_CARD` | The subscriber has no off-session chargeable card on file |

        | `SAME_SUBSCRIPTION` | The target subscription is the same as the subscriber''s current subscription |

        | `PRORATION_BELOW_MINIMUM` | The prorated charge difference is below the minimum chargeable amount (2 AED / 0.55
        in other currencies) |

        | `CHARGE_FAILED` | The proration charge was declined (includes a decline reason) |

        '
      parameters:
      - in: path
        name: subscriptionId
        schema:
          type: string
          default: MPB-SUB-89F44540B6
        required: true
        description: Subscription ID (the subscriber's current subscription)
        example: MPB-SUB-89F44540B6
      - in: path
        name: subscriberId
        schema:
          type: string
          default: MPB-SUBSCRIBER-9164BF542E
        required: true
        description: Subscriber ID
        example: MPB-SUBSCRIBER-9164BF542E
      - name: Content-Type
        in: header
        schema:
          type: string
        example: application/json
