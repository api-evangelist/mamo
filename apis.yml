aid: mamo
name: Mamo
description: >-
  Mamo is a UAE-based fintech platform (Mamo Pay / Mamo Business) offering
  integrated payment solutions for businesses across the Gulf. Its products
  include hosted payment links and checkout, subscriptions and recurring
  billing, merchant-initiated charges with saved cards, refunds/captures/holds,
  invoicing, global payouts and disbursements to recipients, virtual and
  physical corporate cards with expense management, and partner cards for
  instant payouts. The Mamo Business API is a REST/JSON API hosted on readme.io
  that lets merchants automate payment link generation, charges, subscriptions,
  disbursements, recipients, card transactions, expenses, and webhooks. The
  platform serves 4,000+ businesses and has processed over AED 12 billion in
  total payment volume.
